[project]
name = "cstructs"
version = "0.0.0"
description = "Pure, statically-typed string transforms invoked by CMake"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["cyclopts>=3"]

[project.scripts]
cstructs = "cstructs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
"mypy>=1.13",
"pyright>=1.1.408",
"pytest>=8",
"ruff>=0.12",
"camas==0.1.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cstructs"]

[tool.mypy]
strict = true
warn_unused_ignores = true
files = ["src", "tests"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["src", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# preview is on solely to reach the DOC rules; explicit-preview-rules keeps
# every other preview rule out until selected by exact code. select (not
# extend-select) because preview also broadens ruff's default selection.
preview = true
explicit-preview-rules = true
select = [
"ASYNC",
"B",
"C4",
"D",
"DOC102",
"DOC202",
"DOC403",
"DOC501",
"DOC502",
"E",
"F",
"FA",
"FLY",
"FURB",
"G",
"I",
"ICN",
"INP",
"ISC",
"LOG",
"N",
"PERF",
"PGH",
"PIE",
"PL",
"PT",
"PTH",
"PYI",
"RET",
"RSE",
"RUF",
"SIM",
"SLF",
"SLOT",
"TC",
"TRY",
"UP",
"W",
"YTT",
]
# DOC201/DOC402 (missing returns/yields sections) are deliberately absent:
# annotations are the single source of truth for parameter and return types,
# so docstrings document only what the type system cannot — raised exceptions.
ignore = [
# formatter conflicts (https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules)
"ISC001",
"ISC002",
"E501", # the formatter owns line length; the rest is unbreakable doctest output
"D102", # code should document itself; a needed comment is a symptom
"D103",
"D105", # magic method contracts are defined by the data model, not prose
"D107", # __init__ is documented by its class
"D205", # summaries here are flowing paragraphs, not one-liners
"D417", # params belong to the type system, not prose (see DOC201/DOC402 above)
"PLC0415", # imports are scoped as narrowly as possible, by design
"PLR0911", # complexity thresholds reward fragmentation over clarity
"PLR0912",
"PLR0913",
"PLR0915",
"PLR2004", # codegen geometry is full of honest small numbers
"TRY003", # messages live in the raise; no exception-class zoo
"TRY004", # ValueError is the CLI's user-error channel (dispatch catches it)
]
allowed-confusables = ["·", "Δ", "—", "≠", "≡", "⚠", "✅", "❌", "×"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
"D",
"INP001",
"TC002",
"TC003",
] # tests document themselves by name; not an installed package
"src/cstructs/cli.py" = [
"TC003",
] # cyclopts resolves command annotations at runtime (get_type_hints)

[tool.ruff.format]
docstring-code-format = true
