[project]
name = "cstructs"
version = "0.0.0"
description = "Pure, statically-typed string transforms invoked by CMake"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["cyclopts>=3"]

[project.scripts]
cstructs = "cstructs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
"mypy>=1.13",
"pyright>=1.1.408",
"pytest>=8",
"ruff>=0.12",
"camas==0.1.30",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cstructs"]

[tool.mypy]
strict = true
warn_unused_ignores = true
files = ["src", "tests"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src", "tests"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["src", "tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
"ASYNC",
"B",
"C4",
"D",
"DOC102",
"DOC202",
"DOC403",
"DOC501",
"DOC502",
"E",
"F",
"FA",
"FLY",
"FURB",
"G",
"I",
"ICN",
"INP",
"ISC",
"LOG",
"N",
"PERF",
"PGH",
"PIE",
"PL",
"PT",
"PTH",
"PYI",
"RET",
"RSE",
"RUF",
"SIM",
"SLF",
"SLOT",
"TC",
"TRY",
"UP",
"W",
"YTT",
]
ignore = [
"ISC001",
"ISC002",
"E501",
"D102",
"D103",
"D105",
"D107",
"D205",
"D417",
"PLC0415",
"PLR0911",
"PLR0912",
"PLR0913",
"PLR0915",
"PLR2004",
"TRY003",
"TRY004",
]
allowed-confusables = ["·", "Δ", "—", "≠", "≡", "⚠", "✅", "❌", "×"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
"D",
"INP001",
"TC002",
"TC003",
]
"src/cstructs/cli.py" = [
"TC003",
]

[tool.ruff.format]
docstring-code-format = true
