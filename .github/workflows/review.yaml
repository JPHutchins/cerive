# Code review — thin consumer of the code-review reusable workflow.
# The full pipeline lives in the pinned ref; this repo keeps only the trigger, the superset
# permissions, the MODEL_API_KEY secret, and .github/prices.json. Bump the @ref to upgrade.
# See: https://github.com/JPHutchins/code-review

name: Code review

on:
  workflow_run:
    workflows: ["ci"]       # our CI workflow name (lowercase) — unmodified
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' ||
       github.event.workflow_run.conclusion == 'failure')
    uses: JPHutchins/code-review/.github/workflows/review-reusable.yaml@v0.1.0-alpha.26
    with:
      head_sha:      ${{ github.event.workflow_run.head_sha }}
      head_branch:   ${{ github.event.workflow_run.head_branch }}
      head_repo:     ${{ github.event.workflow_run.head_repository.full_name }}
      run_id:        ${{ github.event.workflow_run.id }}
      conclusion:    ${{ github.event.workflow_run.conclusion }}
      trigger_event: ${{ github.event.workflow_run.event }}
      api_base_url:  ${{ vars.API_BASE_URL }}
      model_full:    deepseek-v4-pro
      model_mechanic: deepseek-v4-flash
      # STATIC review (time limits + grace periods are the reusable workflow's defaults: 24m + 12m · 6m + 3m).
    secrets:
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
