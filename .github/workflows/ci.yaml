name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  camas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: nixbuild/nix-quick-install-action@v35
        with:
          nix_conf: |
            keep-env-derivations = true
            keep-outputs = true
      - uses: nix-community/cache-nix-action@v7
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('**/*.nix', '**/flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
      - run: nix develop --command camas
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: evidence-matrix
          path: build/matrix/
  zephyr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          path: cerive
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: zephyrproject-rtos/action-zephyr-setup@v1.0.15
        with:
          app-path: cerive
          manifest-file-name: zephyr/west.yaml
          toolchains: arm-zephyr-eabi
      - run: west twister -T cerive/tests/zephyr -p qemu_cortex_m3 --inline-logs -v
      - run: grep -rF 'SUITE PASS - 100.00% [cerive]' twister-out
  version-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          version=$(sed -nE 's/^#define CERIVE_VERSION_(MAJOR|MINOR|PATCH) ([0-9]+)$/\2/p' include/cerive/cerive.h | paste -sd.)
          test "v${version}" = "${GITHUB_REF_NAME}" \
            || { echo "::error::cerive.h is v${version}, tag is ${GITHUB_REF_NAME}"; exit 1; }
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [camas, zephyr, version-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: evidence-matrix
          path: evidence-matrix
      - run: |
          mkdir assets
          cp evidence-matrix/report.md "assets/cerive-${GITHUB_REF_NAME}-evidence.md"
          tar -czf "assets/cerive-${GITHUB_REF_NAME}-evidence-matrix.tar.gz" -C evidence-matrix .
      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
